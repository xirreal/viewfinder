plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'dev.kikugie.stonecutter'
}

def minecraftVersion = stonecutter.current.version.toString()
def versionConfig = [
	'26.1': [loader: '0.18.4', fabricApi: '0.144.0+26.1', iris: 'Yi5E3d2l', sodium: 'Amr4VcZo', java: 21, minecraftRange: '>=26.1 <26.2-', irisRange: '>=1.10.8'],
	'26.2': [loader: '0.19.3', fabricApi: '0.157.0+26.2', iris: 'oaD6KQls', sodium: '2Yom1N68', java: 25, minecraftRange: '26.2.x', irisRange: '>=1.11.2']
][minecraftVersion]

version = "${project.mod_version}+${minecraftVersion}"
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${minecraftVersion}"
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"viewfinder" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

   accessWidenerPath = rootProject.file("src/main/resources/viewfinder.accesswidener")
}

configurations {
    clientImplementation.extendsFrom(commonImplementation)
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${minecraftVersion}"

	implementation "net.fabricmc:fabric-loader:${versionConfig.loader}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${versionConfig.fabricApi}"

	// Iris
	implementation "maven.modrinth:iris:${versionConfig.iris}"

	// Sodium (required by Iris at runtime)
	runtimeOnly "maven.modrinth:sodium:${versionConfig.sodium}"

	// JSON used by captures and MCP structured results
	implementation "com.google.code.gson:gson:2.10.1"

	// MCP protocol core. The HTTP listener stays on the JDK to avoid a web stack.
	implementation(include("io.modelcontextprotocol.sdk:mcp-core:2.0.0"))
	implementation(include("io.modelcontextprotocol.sdk:mcp-json-jackson2:2.0.0"))
	implementation(include("io.projectreactor:reactor-core:3.7.0"))
	implementation(include("org.reactivestreams:reactive-streams:1.0.4"))
	implementation(include("com.fasterxml.jackson.core:jackson-annotations:2.20"))
	implementation(include("com.fasterxml.jackson.core:jackson-core:2.20.1"))
	implementation(include("com.fasterxml.jackson.core:jackson-databind:2.20.1"))
	implementation(include("com.networknt:json-schema-validator:2.0.0"))
	implementation(include("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.20.1"))
	implementation(include("org.yaml:snakeyaml:2.4"))
	implementation(include("com.ethlo.time:itu:1.14.0"))

	testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.12.2"

}

test {
	useJUnitPlatform()
}

processResources {
	def properties = [
		version: project.version,
		minecraft: versionConfig.minecraftRange,
		loader: versionConfig.loader,
		iris: versionConfig.irisRange,
		java: versionConfig.java
	]
	inputs.properties properties

	filesMatching("fabric.mod.json") {
		expand properties
	}
}

processClientResources {
	inputs.property "java", versionConfig.java
	filesMatching("viewfinder.client.mixins.json") {
		expand java: versionConfig.java
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = versionConfig.java
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(versionConfig.java)
	targetCompatibility = JavaVersion.toVersion(versionConfig.java)
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
